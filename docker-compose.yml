services:
  frontend:
    container_name: frontend
    build:
      context: ./app/frontend
      dockerfile: ./Dockerfile
      target: ${TARGET:-dev}
    ports:
      - ${FRONT_PORT:-3000}:3000
    command: ${FRONT_COMMAND:-npm run dev}
    volumes:
      - ./app/frontend/src:/app-frontend/src
    depends_on:
      - backend
      - whatsapp-api
    environment:
      - API_URL=${API_URL:-http://backend:3001}
      - NEXT_PUBLIC_WHATSAPP_API=${WHATSAPP_API_URL:-http://localhost:3002}
    healthcheck:
      test: ["CMD", "lsof", "-t", "-i:3000"]
      timeout: 10s
      retries: 5
    networks:
      - app-network

  backend:
    container_name: backend
    build:
      context: ./app/backend
      dockerfile: ./Dockerfile
      target: ${TARGET:-dev}
    ports:
      - ${BACKEND_PORT:-3001}:3001
    command: ${BACK_COMMAND:-sh -c "npm run db:generate && npm run db:migrate && npm run dev"}
    volumes:
      - ./app/backend/src:/app-backend/src
    depends_on:
      - db
    env_file:
      - ./app/backend/.env
    environment:
      - PORT=${BACKEND_PORT:-3001}
      - DATABASE_URL=${DATABASE_URL:-postgres://root:root@db:5432/queue-dev}
      - JWT_SECRET=${JWT_SECRET:-SENHACECRETA}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-1d}
      - WHATSAPP_API_URL=${WHATSAPP_API_URL:-http://whatsapp-api:3002}
      - THIS_URL=${THIS_URL:-https://seu-dominio.com.br}
      - MP_ACCESS_TOKEN=${MP_ACCESS_TOKEN:-SUA_CHAVE_MERCADOPAGO}
    healthcheck:
      test: ["CMD", "lsof", "-t", "-i:3001"]
      timeout: 10s
      retries: 5
    restart: always
    networks:
      - app-network

  whatsapp-api:
    container_name: whatsapp-api
    build:
      context: ./app/whatsapp-api
      dockerfile: ./Dockerfile
      target: ${TARGET:-dev}
    ports:
      - ${WA_PORT:-3002}:3002
    command: ${WA_COMMAND:-npm run dev}
    volumes:
      - ./app/whatsapp-api/src:/app-whatsapp-api/src
    environment:
      - PORT=${WA_PORT:-3002}
    healthcheck:
      test: ["CMD", "lsof", "-t", "-i:3002"]
      timeout: 10s
      retries: 5
    networks:
      - app-network

  db-studio:
    container_name: db-studio
    build:
      context: ./app/backend
      dockerfile: ./Dockerfile
      target: ${TARGET:-dev}
    ports:
      - ${STUDIO_PORT:-5555}:5555
    working_dir: /app-backend
    command: sh -c "npm run db:studio"
    depends_on:
      - backend
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgres://root:root@db:5432/queue}
    healthcheck:
      test: ["CMD", "lsof", "-t", "-i:5555"]
      timeout: 10s
      retries: 5
    networks:
      - app-network

  db:
    image: postgres:latest
    container_name: db
    platform: linux/x86_64
    ports:
      - ${DB_PORT:-5432}:5432/tcp
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-root}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-root}
    restart: always
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
